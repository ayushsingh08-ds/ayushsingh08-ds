name: Compile profile README

on:
  schedule: # 03:00 JST == 18:00 UTC
    - cron: "0 18 * * *"
  push:
    paths:
      - 'profile.json'
      - 'generate.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: compile-profile-readme

    steps:
      - uses: actions/checkout@v3

      # The isometric contribution graph (yoshi389111/github-profile-3d-contrib)
      # and the local profile-3d-contrib/*.svg it produced used to be part of the
      # README. They are replaced by assets/cards/contrib.svg, a locally drawn
      # 12-month calendar in the same palette as every other card, so nothing in
      # the README depends on a prebuilt asset any more.
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Run Profile Compiler
        env:
          # Authenticates the GitHub stats fetch so the daily build never falls
          # back to cached numbers because of the 60/hour unauthenticated limit.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python generate.py
      
      - name: Commit & Push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A .
          git commit -m "compiled profile assets" || echo "no changes to commit"
          git push
