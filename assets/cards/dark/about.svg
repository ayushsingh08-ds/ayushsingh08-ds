<text x="28" y="82" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13.5" fill="#D8CBC2">Backend and data systems engineer focused on what happens under the</text><text x="28" y="103" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13.5" fill="#D8CBC2">hood, database locking, replication boundaries, and fault-tolerant</text><text x="28" y="124" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13.5" fill="#D8CBC2">lakehouse architectures. I prefer hard problems involving distributed</text><text x="28" y="145" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13.5" fill="#D8CBC2">state and data integrity over surface-level integrations.</text>
