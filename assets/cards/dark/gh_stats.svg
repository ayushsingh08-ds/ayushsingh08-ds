<svg fill="none" viewBox="0 0 419 196" width="419" height="196" xmlns="http://www.w3.org/2000/svg">
  <foreignObject x="0" y="0" width="419" height="196">
    <div xmlns="http://www.w3.org/1999/xhtml" style="width: 419px; height: 196px; box-sizing: border-box;">
      <style>
        @import url('https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&amp;family=Inter:wght@400;500;600&amp;family=Outfit:wght@500;600&amp;display=swap');
body { font-family: 'Inter', sans-serif; color: #c9d1d9; margin: 0; padding: 0;
       background-color: transparent; }
* { box-sizing: border-box; }
.card { width: 100%; height: 100%; background-color: #161b22;
        border: 1px solid #30363d; border-radius: 10px; padding: 18px 20px; }
.label { font-family: 'Courier Prime', monospace; font-size: 10.5px;
         letter-spacing: 0.14em; text-transform: uppercase; color: #7d8590; }
.mono { font-family: 'Courier Prime', monospace; }
.rule { flex: 1; height: 1px; background-color: #30363d; }
.head { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
.name { font-family: 'Outfit', sans-serif; font-weight: 600; letter-spacing: -0.01em; }
.chip { font-family: 'Courier Prime', monospace; font-size: 10.5px;
        color: #8b949e; background-color: #21262d; border: 1px solid #30363d;
        border-radius: 4px; padding: 2px 6px; }
.highlight-text { color: #e08d63; font-weight: 600; }
.pill { font-family: 'Courier Prime', monospace; font-size: 9.5px;
        letter-spacing: 0.1em; text-transform: uppercase; padding: 3px 8px;
        border-radius: 999px; border: 1px solid; white-space: nowrap; }
.pill-done { color: #7ee787; background-color: #152418; border-color: #2b4a33; }
.pill-wip { color: #e8a569; background-color: #2b1f12; border-color: #4d3620; }

        
      </style>
      
<div class="card">
  <div class="head"><span class="label">GitHub stats</span><span class="rule"></span><span class="label">REST API · 2026-09-21</span></div>
  <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
    <div style="background-color: #21262d; border: 1px solid #30363d; border-radius: 8px;
                padding: 10px 12px;">
      <div class="name" style="font-size: 20px; color: #f0f6fc;">23</div>
      <div class="label" style="font-size: 9.5px; margin-top: 4px;">Repositories</div>
    </div>
    
    <div style="background-color: #21262d; border: 1px solid #30363d; border-radius: 8px;
                padding: 10px 12px;">
      <div class="name" style="font-size: 20px; color: #f0f6fc;">105</div>
      <div class="label" style="font-size: 9.5px; margin-top: 4px;">Stars</div>
    </div>
    
    <div style="background-color: #21262d; border: 1px solid #30363d; border-radius: 8px;
                padding: 10px 12px;">
      <div class="name" style="font-size: 20px; color: #f0f6fc;">38</div>
      <div class="label" style="font-size: 9.5px; margin-top: 4px;">Followers</div>
    </div>
    
    <div style="background-color: #21262d; border: 1px solid #30363d; border-radius: 8px;
                padding: 10px 12px;">
      <div class="name" style="font-size: 20px; color: #f0f6fc;">8</div>
      <div class="label" style="font-size: 9.5px; margin-top: 4px;">Languages</div>
    </div>
    </div>
</div>

    </div>
  </foreignObject>
</svg>