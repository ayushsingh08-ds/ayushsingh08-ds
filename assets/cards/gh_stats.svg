<svg fill="none" viewBox="0 0 510 210" width="510" height="210" xmlns="http://www.w3.org/2000/svg">
  <foreignObject x="0" y="0" width="510" height="210">
    <div xmlns="http://www.w3.org/1999/xhtml" style="width: 510px; height: 210px; box-sizing: border-box;">
      <style>
        
@import url('https://fonts.googleapis.com/css2?family=Architects+Daughter&amp;family=Inter:wght@300;400;500;600;700&amp;family=Outfit:wght@400;500;600;700;800&amp;family=Courier+Prime&amp;display=swap');
body {
  font-family: 'Inter', sans-serif;
  color: #3c2f2f;
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  background-color: transparent;
}
h1, h2, h3, h4, h5, h6 {
  font-family: 'Outfit', sans-serif;
  color: #2c1e1e;
  margin: 0;
}
.card {
  background-color: #fffdfa;
  border: 1px solid #e5dacf;
  border-radius: 12px;
  padding: 20px;
  box-shadow: 0 4px 10px rgba(139, 115, 85, 0.05);
  box-sizing: border-box;
  height: 100%;
}
.card-title {
  font-size: 18px;
  font-weight: 700;
  margin-bottom: 16px;
  display: flex;
  align-items: center;
  gap: 6px;
  color: #2c1e1e;
}

      </style>
      
<style>
  .card-title {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .card-note { font-size: 11px; font-weight: 500; color: #9c8b86; }
  .stat-grid { display: flex; gap: 10px; }
  .stat-tile {
    flex: 1;
    background-color: #f4ebe1;
    border: 1px solid #e5dacf;
    border-radius: 8px;
    padding: 12px 8px;
    text-align: center;
  }
  .stat-value {
    font-family: 'Outfit', sans-serif;
    font-size: 24px;
    font-weight: 800;
    line-height: 1.1;
    color: #2c1e1e;
  }
  .stat-label { font-size: 11px; color: #7a6a65; margin-top: 3px; }
  .stat-foot { margin-top: 14px; font-size: 10.5px; color: #9c8b86; text-align: center; }
</style>
<div class="card" style="height: 210px; box-sizing: border-box;">
  <h2 class="card-title">📊 GitHub Stats <span class="card-note">github.com/ayushsingh08-ds</span></h2>
  <div class="stat-grid">
    <div class="stat-tile">
      <div class="stat-value">23</div>
      <div class="stat-label">Public repositories</div>
    </div>
    
    <div class="stat-tile">
      <div class="stat-value">105</div>
      <div class="stat-label">Stars earned</div>
    </div>
    
    <div class="stat-tile">
      <div class="stat-value">38</div>
      <div class="stat-label">Followers</div>
    </div>
    
    <div class="stat-tile">
      <div class="stat-value">5</div>
      <div class="stat-label">Languages used</div>
    </div>
    
  </div>
  <div class="stat-foot">Updated 2026-09-21</div>
</div>

    </div>
  </foreignObject>
</svg>