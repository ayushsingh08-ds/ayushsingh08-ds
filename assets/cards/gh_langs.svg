<svg fill="none" viewBox="0 0 510 210" width="510" height="210" xmlns="http://www.w3.org/2000/svg">
  <foreignObject x="0" y="0" width="510" height="210">
    <div xmlns="http://www.w3.org/1999/xhtml" style="width: 510px; height: 210px; box-sizing: border-box;">
      <style>
        
@import url('https://fonts.googleapis.com/css2?family=Architects+Daughter&amp;family=Inter:wght@300;400;500;600;700&amp;family=Outfit:wght@400;500;600;700;800&amp;family=Courier+Prime&amp;display=swap');
body {
  font-family: 'Inter', sans-serif;
  color: #3c2f2f;
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  background-color: transparent;
}
h1, h2, h3, h4, h5, h6 {
  font-family: 'Outfit', sans-serif;
  color: #2c1e1e;
  margin: 0;
}
.card {
  background-color: #fffdfa;
  border: 1px solid #e5dacf;
  border-radius: 12px;
  padding: 20px;
  box-shadow: 0 4px 10px rgba(139, 115, 85, 0.05);
  box-sizing: border-box;
  height: 100%;
}
.card-title {
  font-size: 18px;
  font-weight: 700;
  margin-bottom: 16px;
  display: flex;
  align-items: center;
  gap: 6px;
  color: #2c1e1e;
}

      </style>
      
<style>
  .card-note { font-size: 11px; font-weight: 500; color: #9c8b86; }
  .lang-row { display: flex; align-items: center; gap: 8px; margin-bottom: 7px; }
  .lang-name { width: 110px; font-size: 12.5px; color: #3c2f2f; }
  .lang-track {
    flex: 1;
    height: 9px;
    background-color: #e5dacf;
    border-radius: 4.5px;
    overflow: hidden;
  }
  .lang-fill { display: block; height: 100%; background-color: #b05a30; border-radius: 4.5px; }
  .lang-count {
    width: 26px;
    text-align: right;
    font-family: 'Courier Prime', monospace;
    font-size: 11.5px;
    color: #7a6a65;
  }
</style>
<div class="card" style="height: 210px; box-sizing: border-box;">
  <h2 class="card-title">🧩 Top Languages <span class="card-note">repositories per language</span></h2>
  <div>
    <div class="lang-row">
      <span class="lang-name">Python</span>
      <span class="lang-track"><span class="lang-fill" style="width: 100%"></span></span>
      <span class="lang-count">8</span>
    </div>
    
    <div class="lang-row">
      <span class="lang-name">JavaScript</span>
      <span class="lang-track"><span class="lang-fill" style="width: 38%"></span></span>
      <span class="lang-count">3</span>
    </div>
    
    <div class="lang-row">
      <span class="lang-name">HTML</span>
      <span class="lang-track"><span class="lang-fill" style="width: 38%"></span></span>
      <span class="lang-count">3</span>
    </div>
    
    <div class="lang-row">
      <span class="lang-name">TypeScript</span>
      <span class="lang-track"><span class="lang-fill" style="width: 25%"></span></span>
      <span class="lang-count">2</span>
    </div>
    
    <div class="lang-row">
      <span class="lang-name">Jupyter Notebook</span>
      <span class="lang-track"><span class="lang-fill" style="width: 25%"></span></span>
      <span class="lang-count">2</span>
    </div>
    
  </div>
</div>

    </div>
  </foreignObject>
</svg>