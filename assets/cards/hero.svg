<svg fill="none" viewBox="0 0 850 240" width="850" height="240" xmlns="http://www.w3.org/2000/svg">
  <foreignObject x="0" y="0" width="850" height="240">
    <div xmlns="http://www.w3.org/1999/xhtml" style="width: 850px; height: 240px; box-sizing: border-box;">
      <style>
        @import url('https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&amp;family=Inter:wght@400;500;600&amp;family=Outfit:wght@500;600&amp;display=swap');
body { font-family: 'Inter', sans-serif; color: #4a3f39; margin: 0; padding: 0;
       background-color: transparent; }
* { box-sizing: border-box; }
.card { width: 100%; height: 100%; background-color: #fffdfa;
        border: 1px solid #e5dacf; border-radius: 10px; padding: 18px 20px; }
.label { font-family: 'Courier Prime', monospace; font-size: 10.5px;
         letter-spacing: 0.14em; text-transform: uppercase; color: #9c8b86; }
.mono { font-family: 'Courier Prime', monospace; }
.rule { flex: 1; height: 1px; background-color: #e5dacf; }
.head { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
.name { font-family: 'Outfit', sans-serif; font-weight: 600; letter-spacing: -0.01em; }
.chip { font-family: 'Courier Prime', monospace; font-size: 10.5px;
        color: #6f6259; background-color: #f7f1e8; border: 1px solid #eadfd2;
        border-radius: 4px; padding: 2px 6px; }
.highlight-text { color: #b05a30; font-weight: 600; }
.pill { font-family: 'Courier Prime', monospace; font-size: 9.5px;
        letter-spacing: 0.1em; text-transform: uppercase; padding: 3px 8px;
        border-radius: 999px; border: 1px solid; white-space: nowrap; }
.pill-done { color: #5c6b46; background-color: #f1f3e8; border-color: #dde2cf; }
.pill-wip { color: #96602f; background-color: #faf0e4; border-color: #eeddc9; }

        
      </style>
      
<div class="card" style="display: flex; gap: 40px;">
  <div style="width: 468px; display: flex; flex-direction: column;">
    <div class="label" style="color: #b05a30;">Final-year Computer Science · Bengaluru, India</div>
    <div class="name" style="font-size: 44px; line-height: 1.25; color: #241c17; margin: 10px 0 12px;">
      Ayush Singh
    </div>
    <div style="font-size: 16px; line-height: 1.5; color: #5a4a42;">
      Building reliable distributed systems, streaming data infrastructure, and backend platforms.
    </div>
    <div style="margin-top: 16px; border-left: 2px solid #b05a30; padding-left: 12px;
                font-size: 13.5px; line-height: 1.5; color: #7a6a65;">
      <div>I enjoy designing systems that continue to work under failure.</div><div>I turn ideas into <span class="highlight-text">production-grade systems</span>.</div>
    </div>
  </div>
  <div style="flex: 1; border-left: 1px solid #efe6da; padding-left: 28px;">
    <div class="label">Focus</div>
    
    <div style="display: flex; gap: 10px; align-items: baseline; padding: 9px 0;
                border-top: 1px solid #f2ebe1;">
      <span class="mono" style="font-size: 9.5px; color: #b05a30;">01</span>
      <span style="font-size: 13px; color: #3c2f2f;">Distributed Systems</span>
    </div>
    
    <div style="display: flex; gap: 10px; align-items: baseline; padding: 9px 0;
                border-top: 1px solid #f2ebe1;">
      <span class="mono" style="font-size: 9.5px; color: #b05a30;">02</span>
      <span style="font-size: 13px; color: #3c2f2f;">Backend Engineering</span>
    </div>
    
    <div style="display: flex; gap: 10px; align-items: baseline; padding: 9px 0;
                border-top: 1px solid #f2ebe1;">
      <span class="mono" style="font-size: 9.5px; color: #b05a30;">03</span>
      <span style="font-size: 13px; color: #3c2f2f;">Data Infrastructure</span>
    </div>
    
  </div>
</div>

    </div>
  </foreignObject>
</svg>